<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kStoneTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8c4bc"/>
      <stop offset="100%" stop-color="#989088"/>
    </linearGradient>
    <linearGradient id="kStoneLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#787068"/>
      <stop offset="100%" stop-color="#484038"/>
    </linearGradient>
    <linearGradient id="kStoneRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#686058"/>
      <stop offset="100%" stop-color="#383028"/>
    </linearGradient>
    <linearGradient id="kBlueTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f7fc8"/>
      <stop offset="100%" stop-color="#3a6db8"/>
    </linearGradient>
    <linearGradient id="kBlueLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a5a98"/>
      <stop offset="100%" stop-color="#1a3a68"/>
    </linearGradient>
    <linearGradient id="kBlueRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f4a88"/>
      <stop offset="100%" stop-color="#0f2a48"/>
    </linearGradient>
  </defs>

  <!-- Foundation slab -->
  <polygon points="35,162 100,192 165,162 165,150 100,180 35,150" fill="#585048"/>
  <polygon points="35,150 100,180 100,192 35,162" fill="url(#kStoneLeft)"/>
  <polygon points="100,180 165,150 165,162 100,192" fill="url(#kStoneRight)"/>

  <!-- Outer curtain wall ring -->
  <polygon points="100,150 158,124 158,118 100,144 42,118 42,124" fill="url(#kStoneTop)"/>
  <polygon points="42,118 100,144 100,150 42,124" fill="url(#kStoneLeft)"/>
  <polygon points="100,144 158,118 158,124 100,150" fill="url(#kStoneRight)"/>
  <!-- Crenellations on outer wall -->
  <rect x="46" y="112" width="5" height="8" fill="#787068"/>
  <rect x="60" y="118" width="5" height="8" fill="#787068"/>
  <rect x="74" y="124" width="5" height="8" fill="#787068"/>
  <rect x="121" y="124" width="5" height="8" fill="#686058"/>
  <rect x="135" y="118" width="5" height="8" fill="#686058"/>
  <rect x="149" y="112" width="5" height="8" fill="#686058"/>

  <!-- Gatehouse (front, projecting) -->
  <polygon points="100,150 122,138 122,108 100,120" fill="url(#kStoneRight)"/>
  <polygon points="100,150 78,138 78,108 100,120" fill="url(#kStoneLeft)"/>
  <polygon points="100,108 122,120 100,132 78,120" fill="url(#kStoneTop)"/>
  <!-- Portcullis -->
  <rect x="92" y="118" width="16" height="22" fill="#1a1a1a"/>
  <line x1="92" y1="120" x2="108" y2="120" stroke="#3a3a3a" stroke-width="0.6"/>
  <line x1="92" y1="125" x2="108" y2="125" stroke="#3a3a3a" stroke-width="0.6"/>
  <line x1="92" y1="130" x2="108" y2="130" stroke="#3a3a3a" stroke-width="0.6"/>
  <line x1="92" y1="135" x2="108" y2="135" stroke="#3a3a3a" stroke-width="0.6"/>
  <line x1="96" y1="118" x2="96" y2="140" stroke="#3a3a3a" stroke-width="0.6"/>
  <line x1="100" y1="118" x2="100" y2="140" stroke="#3a3a3a" stroke-width="0.6"/>
  <line x1="104" y1="118" x2="104" y2="140" stroke="#3a3a3a" stroke-width="0.6"/>
  <!-- Gatehouse crenellations -->
  <rect x="82" y="104" width="5" height="6" fill="#787068"/>
  <rect x="98" y="104" width="5" height="6" fill="#787068"/>
  <rect x="113" y="104" width="5" height="6" fill="#686058"/>

  <!-- Main central keep (square, tall) -->
  <polygon points="100,140 142,118 142,58 100,80" fill="url(#kStoneRight)"/>
  <polygon points="100,140 58,118 58,58 100,80" fill="url(#kStoneLeft)"/>
  <polygon points="100,58 142,80 100,102 58,80" fill="url(#kStoneTop)"/>

  <!-- Blue pyramidal roof on keep -->
  <polygon points="100,58 142,80 100,40 58,80" fill="url(#kBlueTop)"/>
  <polygon points="58,80 100,40 100,58" fill="url(#kBlueLeft)"/>
  <polygon points="100,40 142,80 100,58" fill="url(#kBlueRight)"/>

  <!-- Gold finial -->
  <line x1="100" y1="40" x2="100" y2="22" stroke="#1a3a68" stroke-width="1.2"/>
  <circle cx="100" cy="20" r="3" fill="#d4a64a"/>
  <polygon points="100,8 104,22 100,26 96,22" fill="#d4a64a"/>

  <!-- Keep windows -->
  <rect x="72" y="92" width="4" height="10" fill="#1a1a22"/>
  <rect x="80" y="92" width="4" height="10" fill="#ffe48a" opacity="0.5"/>
  <rect x="116" y="92" width="4" height="10" fill="#1a1a22"/>
  <rect x="124" y="92" width="4" height="10" fill="#ffe48a" opacity="0.5"/>
  <rect x="93" y="100" width="4" height="10" fill="#1a1a22"/>
  <rect x="103" y="100" width="4" height="10" fill="#ffe48a" opacity="0.5"/>

  <!-- Corner towers (4 square - 2 visible) -->
  <!-- Left tower -->
  <polygon points="42,118 55,112 55,68 42,74" fill="url(#kStoneRight)"/>
  <polygon points="42,118 29,112 29,68 42,74" fill="url(#kStoneLeft)"/>
  <polygon points="42,68 55,74 42,80 29,74" fill="url(#kStoneTop)"/>
  <rect x="32" y="108" width="4" height="6" fill="#484038"/>
  <rect x="48" y="108" width="4" height="6" fill="#484038"/>
  <!-- Conical blue roof -->
  <polygon points="42,68 55,74 42,46 29,74" fill="url(#kBlueTop)"/>
  <polygon points="29,74 42,46 42,68" fill="url(#kBlueLeft)"/>
  <polygon points="42,46 55,74 42,68" fill="url(#kBlueRight)"/>
  <line x1="42" y1="46" x2="42" y2="38" stroke="#1a3a68" stroke-width="0.8"/>
  <circle cx="42" cy="36" r="1.5" fill="#d4a64a"/>

  <!-- Right tower -->
  <polygon points="158,118 145,112 145,68 158,74" fill="url(#kStoneLeft)"/>
  <polygon points="158,118 171,112 171,68 158,74" fill="url(#kStoneRight)"/>
  <polygon points="158,68 145,74 158,80 171,74" fill="url(#kStoneTop)"/>
  <rect x="148" y="108" width="4" height="6" fill="#484038"/>
  <rect x="164" y="108" width="4" height="6" fill="#484038"/>
  <polygon points="158,68 171,74 158,46 145,74" fill="url(#kBlueTop)"/>
  <polygon points="145,74 158,46 158,68" fill="url(#kBlueLeft)"/>
  <polygon points="158,46 171,74 158,68" fill="url(#kBlueRight)"/>
  <line x1="158" y1="46" x2="158" y2="38" stroke="#1a3a68" stroke-width="0.8"/>
  <circle cx="158" cy="36" r="1.5" fill="#d4a64a"/>

  <!-- King banner (royal blue) -->
  <line x1="100" y1="22" x2="100" y2="6" stroke="#1a2a18" stroke-width="1"/>
  <polygon points="100,6 118,12 100,20" fill="#3a6db8"/>
  <polygon points="100,6 118,12 100,14" fill="#1a3a68" opacity="0.6"/>
  <!-- Gold crest on banner -->
  <circle cx="106" cy="11" r="1.5" fill="#d4a64a"/>
</svg>
